# Paper 1.21.8 / Java 21을 기준으로 작성된 기본 설정.
# 시간은 별도 표시가 없으면 초 단위입니다.
# 일부 설정은 진행 중 경기에는 적용되지 않고 다음 경기부터 적용됩니다.

rooms:
  minimum-players: 2
  default-capacity: 10
  maximum-capacity: 10
  maximum-rooms: 40
  default-public: true

lobby:
  teleport-on-join: true

  # true이면 Valo 참가자가 아닌 일반 접속자도 로비 월드에서 보호됩니다.
  # 일반 생존 월드와 로비 월드를 분리하는 것을 권장합니다.
  protect-world: true

  # PLAY Interaction 크기.
  button-width: 1.6
  button-height: 1.6

  # 자동 설치 시 관리자가 바라보는 블록까지 탐색할 거리.
  button-placement-range: 8.0

  title: "전술 훈련장"
  subtitle: "PLAY 버튼을 눌러 경기에 참가하세요"

selection:
  loading-seconds: 3
  timeout-seconds: 30

  # true: 시간 만료 시 미확정자도 제트로 자동 확정.
  # false: 선택 실패로 시작을 취소하고 파티로 복귀.
  auto-select: true

  countdown-seconds: 5

match:
  buy-seconds: 25
  round-seconds: 100
  round-end-seconds: 5
  result-seconds: 12
  target-wins: 7

  # 완료된 라운드 수가 이 값에 도달하면 공수 교대.
  swap-after-rounds: 6

  friendly-fire: false
  spawn-protection-radius: 7.0

  # 구매 단계에서 팀 스폰 반경 밖 이동 금지.
  restrict-buy-movement: true

  # 공수 교대 시 자금을 초기화하는 정책.
  reset-money-on-swap: true

economy:
  starting-money: 800
  maximum-money: 9000
  win-reward: 3000
  loss-base-reward: 1900
  loss-streak-step: 500
  loss-streak-cap: 4
  kill-reward: 200
  plant-reward: 300

  # 클래식은 무료 기본 지급. 추가 총기 지급/재구매 없음.
  classic-price: 0

  # 라운드당 방어구 1회 구매.
  armor-price: 400
  armor-points: 25.0

  # 라운드당 해당 추가 충전 상품 1회 구매.
  dash-charge-price: 200
  smoke-charge-price: 200

classic:
  magazine: 12
  reserve-ammo: 36
  fire-interval-ticks: 5
  reload-ticks: 30
  maximum-range: 70.0
  headshot-multiplier: 3.0

  # 거리별 몸통 피해량. Minecraft 체력 단위: 20 = 일반 최대 체력.
  damage:
    near-distance: 15.0
    middle-distance: 30.0
    near: 5.2
    middle: 4.4
    far: 3.6

  # 눈 위치와 피격 지점의 차이로 머리 판정.
  headshot-height-tolerance: 0.30

jett:
  dash:
    initial-charges: 1
    maximum-charges: 2
    cooldown-ticks: 20

    # 방향을 수평으로 정규화하고 제한 거리까지 충돌 검사.
    distance: 5.5
    step-size: 0.20

    # 천장, 벽 통과를 막기 위한 플레이어 몸체 여유 폭.
    collision-padding: 0.32

    # 과도한 수직 이동을 허용하지 않습니다.
    maximum-vertical-offset: 0.20

  smoke:
    initial-charges: 2
    maximum-charges: 3
    cooldown-ticks: 12
    duration-seconds: 7
    radius: 2.8
    maximum-range: 18.0
    maximum-active-per-match: 8

    # 연막 갱신 주기와 한 구체의 표면 파티클 수.
    update-interval-ticks: 4
    surface-particles: 180
    interior-particles: 24

    # 연막 내부 플레이어에게 짧은 효과를 갱신 적용.
    apply-darkness-inside: true

    # 파티클 가시거리 제한. 모든 서버 플레이어에게 보내지 않습니다.
    viewer-distance: 48.0

spike:
  plant-seconds: 4
  defuse-seconds: 7
  explosion-seconds: 40
  interaction-range: 3.0

  # 설치/해체 시작 지점으로부터 이 거리 이상 움직이면 취소.
  movement-cancel-distance: 0.25

  # 설치: 스파이크를 들고 우클릭 유지 대신 웅크리기 유지.
  # 해체: 설치된 스파이크 주변에서 웅크리기 유지.
  # 서버는 물리적인 마우스 버튼 유지 상태를 안정적으로 제공하지 않습니다.
  require-sneaking: true

ui:
  # 0이면 CustomModelData를 사용하지 않습니다.
  # 선택형 리소스팩은 아래 번호를 기준으로 모델을 연결할 수 있습니다.
  models:
    classic: 0
    shop: 0
    dash: 0
    smoke: 0
    spike: 0

sounds:
  # 커스텀 키를 쓰려면 클라이언트 리소스팩의 sounds.json 등록이 필요합니다.
  # 아래 기본값은 리소스팩 없이 작동하는 바닐라 키입니다.

  lobby-enter:
    enabled: true
    key: "minecraft:entity.player.levelup"
    volume: 0.45
    pitch: 1.4

  lobby-music:
    enabled: false
    key: "minecraft:music.menu"
    volume: 0.25
    pitch: 1.0

  menu-open:
    enabled: true
    key: "minecraft:block.note_block.pling"
    volume: 0.45
    pitch: 1.5

  menu-click:
    enabled: true
    key: "minecraft:ui.button.click"
    volume: 0.6
    pitch: 1.0

  menu-error:
    enabled: true
    key: "minecraft:block.note_block.bass"
    volume: 0.7
    pitch: 0.65

  agent-confirm:
    enabled: true
    key: "minecraft:block.note_block.chime"
    volume: 0.8
    pitch: 1.4

  countdown:
    enabled: true
    key: "minecraft:block.note_block.hat"
    volume: 0.7
    pitch: 1.0

  dash:
    enabled: true
    key: "minecraft:entity.breeze.shoot"
    volume: 0.9
    pitch: 1.2

  smoke:
    enabled: true
    key: "minecraft:entity.snowball.throw"
    volume: 0.8
    pitch: 0.8

  classic-fire:
    enabled: true
    key: "minecraft:entity.firework_rocket.blast"
    volume: 0.8
    pitch: 1.7

  classic-reload:
    enabled: true
    key: "minecraft:block.iron_trapdoor.close"
    volume: 0.7
    pitch: 1.4

  spike-plant:
    enabled: true
    key: "minecraft:block.beacon.activate"
    volume: 0.8
    pitch: 1.2

  spike-defuse:
    enabled: true
    key: "minecraft:block.beacon.deactivate"
    volume: 0.8
    pitch: 1.2

  spike-tick:
    enabled: true
    key: "minecraft:block.note_block.hat"
    volume: 0.7
    pitch: 1.5

  spike-explode:
    enabled: true
    key: "minecraft:entity.generic.explode"
    volume: 1.0
    pitch: 0.8

  round-start:
    enabled: true
    key: "minecraft:block.note_block.chime"
    volume: 0.9
    pitch: 1.1

  round-end:
    enabled: true
    key: "minecraft:block.note_block.bell"
    volume: 0.9
    pitch: 0.8

  victory:
    enabled: true
    key: "minecraft:ui.toast.challenge_complete"
    volume: 0.8
    pitch: 1.0

  defeat:
    enabled: true
    key: "minecraft:entity.wither.death"
    volume: 0.35
    pitch: 1.4